name: Deployable Linux build

on:
  push:
    tags:
      - 'deploy-*'

permissions:
  contents: write

concurrency:
  group: lifeos-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-linux-amd64-v1:
    name: Test and build Linux AMD64 v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify deployment tag points to main
        shell: bash
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Check frontend
        working-directory: web
        run: npm run check

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Verify Go dependencies and formatting
        shell: bash
        run: |
          go mod verify
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt failures:"
            gofmt -l .
            exit 1
          fi

      - name: Vet and test
        run: |
          go vet ./...
          go test -race ./...

      - name: Embed frontend
        run: |
          rm -rf internal/web/dist/build
          cp -r web/build internal/web/dist/build

      - name: Build static Linux binary for Atom D525
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 GOAMD64=v1 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -X github.com/theDenuvo/LifeOS/cmd/lifeos.version=${VERSION}" \
            -o dist/lifeos ./cmd/lifeos
          file dist/lifeos
          file dist/lifeos | grep -q "ELF 64-bit LSB.*x86-64"
          (cd dist && sha256sum lifeos > lifeos.sha256)
          ./dist/lifeos -version

      - name: Publish deployment release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LifeOS ${{ github.ref_name }}
          body: |
            Automated, tested Linux AMD64 v1 build for Intel Atom D525.
            Commit: ${{ github.sha }}
            Built by GitHub Actions after frontend checks, go vet and Go tests.
          prerelease: true
          make_latest: false
          files: |
            dist/lifeos
            dist/lifeos.sha256
          fail_on_unmatched_files: true
