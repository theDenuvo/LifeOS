openapi: 3.1.0
info:
  title: LifeOS API
  version: 1.0.0
  description: REST API for LifeOS - Personal Operating System with Intelligent Assistant
  contact:
    name: LifeOS Team
    url: https://github.com/theDenuvo/LifeOS
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://127.0.0.1:8787
  description: Development server
- url: https://lifeos.example.ts.net
  description: Production server (Tailscale)
paths:
  /healthz:
    get:
      summary: Health check endpoint
      operationId: healthz
      tags:
      - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/tasks:
    get:
      summary: List tasks with filtering and pagination
      operationId: listTasks
      tags:
      - Tasks
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - open
          - completed
          - cancelled
        description: Filter by task status (repeatable)
      - name: priority
        in: query
        schema:
          type: string
          enum:
          - low
          - medium
          - high
        description: Filter by priority
      - name: planned_date
        in: query
        schema:
          type: string
          format: date
        description: Filter by planned date (YYYY-MM-DD)
      - name: due_date
        in: query
        schema:
          type: string
          format: date
        description: Filter by calendar deadline (YYYY-MM-DD)
      - name: overdue
        in: query
        schema:
          type: boolean
        description: Filter only overdue tasks
      - name: search
        in: query
        schema:
          type: string
        description: Full-text search in title and note
      - name: tags
        in: query
        schema:
          type: string
        description: Comma-separated tags (AND logic)
      - name: sort
        in: query
        schema:
          type: string
          pattern: ^(-?)(created_at|updated_at|due_at|priority|title)$
        description: Sort field with optional - prefix for DESC
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      summary: Create a new task
      operationId: createTask
      tags:
      - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/tasks/{id}:
    get:
      summary: Get a task by ID
      operationId: getTask
      tags:
      - Tasks
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Task found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Partially update a task
      operationId: updateTask
      tags:
      - Tasks
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: '^"?[1-9][0-9]*"?$'
        description: Optimistic locking - the task version from the last read (ETag)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'
  /api/v1/tasks/{id}/complete:
    post:
      summary: Mark task as completed
      operationId: completeTask
      tags:
      - Tasks
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Task completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'
  /api/v1/tasks/{id}/cancel:
    post:
      summary: Mark task as cancelled
      operationId: cancelTask
      tags:
      - Tasks
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Task cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'
  /api/v1/tasks/{id}/restore:
    post:
      summary: Restore a completed or cancelled task
      operationId: restoreTask
      tags:
      - Tasks
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Task restored to open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'
  /api/v1/tasks/{id}/reschedule:
    post:
      summary: Reschedule a task
      operationId: rescheduleTask
      tags:
      - Tasks
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRescheduleRequest'
      responses:
        '200':
          description: Task rescheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'
  /api/v1/inbox:
    get:
      summary: List inbox items
      operationId: listInbox
      tags:
      - Inbox
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
      - name: unprocessed_only
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: List of inbox items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      summary: Capture a new inbox item
      operationId: captureInbox
      tags:
      - Inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxCaptureRequest'
      responses:
        '201':
          description: Inbox item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxItemResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/inbox/{id}/convert:
    post:
      summary: Convert inbox item to task
      operationId: convertInbox
      tags:
      - Inbox
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxConvertRequest'
      responses:
        '201':
          description: Task created from inbox item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /api/v1/inbox/{id}:
    delete:
      summary: Dismiss an inbox item
      operationId: dismissInbox
      tags:
      - Inbox
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Inbox item dismissed
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /api/v1/summary/today:
    get:
      summary: Get today's summary (main screen data)
      operationId: todaySummary
      tags:
      - Summary
      responses:
        '200':
          description: Today's summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/assistant/messages:
    post:
      summary: Send message to assistant
      operationId: assistantMessage
      tags:
      - Assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantMessageRequest'
      responses:
        '202':
          description: Message accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantMessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '501':
          $ref: '#/components/responses/NotImplementedError'
  /api/v1/assistant/conversations:
    get:
      summary: List conversations
      operationId: listConversations
      tags:
      - Assistant
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '501':
          $ref: '#/components/responses/NotImplementedError'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/assistant/conversations/{id}:
    get:
      summary: Get conversation with messages
      operationId: getConversation
      tags:
      - Assistant
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '501':
          $ref: '#/components/responses/NotImplementedError'
  /api/v1/assistant/pending-actions/{id}/confirm:
    post:
      summary: Confirm a pending action
      operationId: confirmPendingAction
      tags:
      - Assistant
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Action confirmed and executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingActionResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '501':
          $ref: '#/components/responses/NotImplementedError'
  /api/v1/assistant/pending-actions/{id}/reject:
    post:
      summary: Reject a pending action
      operationId: rejectPendingAction
      tags:
      - Assistant
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Action rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingActionResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '501':
          $ref: '#/components/responses/NotImplementedError'
  /api/v1/events:
    get:
      summary: Server-Sent Events stream for real-time updates
      operationId: events
      tags:
      - Events
      parameters:
      - name: Last-Event-ID
        in: header
        schema:
          type: string
        description: Resume from last received event ID
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '501':
          $ref: '#/components/responses/NotImplementedError'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/settings/{key}:
    get:
      summary: Get a setting value
      operationId: getSetting
      tags:
      - Settings
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Setting value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '501':
          $ref: '#/components/responses/NotImplementedError'
    put:
      summary: Set a setting value
      operationId: putSetting
      tags:
      - Settings
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingRequest'
      responses:
        '200':
          description: Setting updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '501':
          $ref: '#/components/responses/NotImplementedError'
components:
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      - version
      - time
      properties:
        status:
          type: string
          enum:
          - ok
        version:
          type: string
        time:
          type: string
          format: date-time
    TaskResponse:
      type: object
      required:
      - id
      - title
      - priority
      - status
      - timezone
      - tags
      - created_at
      - updated_at
      - overdue
      - version
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 500
        note:
          type: string
          maxLength: 5000
        priority:
          type: string
          enum:
          - low
          - medium
          - high
        status:
          type: string
          enum:
          - open
          - completed
          - cancelled
        planned_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        due_at:
          type: string
          format: date-time
        timezone:
          type: string
          default: Europe/Moscow
        tags:
          type: array
          items:
            type: string
            maxLength: 50
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        cancelled_at:
          type: string
          format: date-time
        overdue:
          type: boolean
        version:
          type: integer
          minimum: 1
          description: Optimistic-locking token; send it back in If-Match for mutations
    TaskCreateRequest:
      type: object
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        note:
          type: string
          maxLength: 5000
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          default: medium
        planned_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        due_at:
          type: string
          format: date-time
        timezone:
          type: string
          default: Europe/Moscow
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          default: []
    TaskUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        note:
          type: string
          maxLength: 5000
        priority:
          type: string
          enum:
          - low
          - medium
          - high
        planned_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        due_at:
          type: string
          format: date-time
        timezone:
          type: string
        tags:
          type: array
          items:
            type: string
            maxLength: 50
    TaskRescheduleRequest:
      type: object
      description: Scheduling fields only; use PATCH to change the task timezone
      properties:
        planned_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        due_at:
          type: string
          format: date-time
    TaskListResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
        meta:
          type: object
          required:
          - limit
          - offset
          - total
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
    InboxItemResponse:
      type: object
      required:
      - id
      - text
      - created_at
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
          maxLength: 2000
        meta:
          type:
          - object
          - 'null'
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        processed_at:
          type:
          - string
          - 'null'
          format: date-time
        converted_task_id:
          type:
          - integer
          - 'null'
          format: int64
    InboxCaptureRequest:
      type: object
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        meta:
          type: object
          additionalProperties: true
    InboxConvertRequest:
      type: object
      properties:
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          default: medium
        planned_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        due_at:
          type: string
          format: date-time
        timezone:
          type: string
    InboxListResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InboxItemResponse'
        meta:
          type: object
          required:
          - limit
          - offset
          - total
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
    SummaryResponse:
      type: object
      required:
      - today
      - overdue
      - high_priority
      - stats
      properties:
        today:
          type: array
          items:
            $ref: '#/components/schemas/TaskSummaryItem'
        overdue:
          type: array
          items:
            $ref: '#/components/schemas/TaskSummaryItem'
        high_priority:
          type: array
          items:
            $ref: '#/components/schemas/TaskSummaryItem'
        stats:
          $ref: '#/components/schemas/SummaryStats'
        focus_task:
          oneOf:
          - $ref: '#/components/schemas/TaskSummaryItem'
          - type: 'null'
    TaskSummaryItem:
      type: object
      required:
      - id
      - title
      - time
      - priority
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        time:
          type: string
        priority:
          type: string
          enum:
          - low
          - medium
          - high
        days_overdue:
          type: integer
          minimum: 1
    SummaryStats:
      type: object
      required:
      - active_total
      - overdue_count
      - high_priority_count
      - completed_today
      - inbox_count
      properties:
        active_total:
          type: integer
        overdue_count:
          type: integer
        high_priority_count:
          type: integer
        completed_today:
          type: integer
        inbox_count:
          type: integer
    AssistantMessageRequest:
      type: object
      required:
      - content
      properties:
        content:
          type: string
        conversation_id:
          type: integer
          format: int64
    AssistantMessageResponse:
      type: object
      required:
      - message_id
      - conversation_id
      - status
      properties:
        message_id:
          type: integer
          format: int64
        conversation_id:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - processing
    ConversationResponse:
      type: object
      required:
      - id
      - title
      - messages
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        context_screen:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageResponse'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
    MessageResponse:
      type: object
      required:
      - id
      - conversation_id
      - role
      - content
      - created_at
      properties:
        id:
          type: integer
          format: int64
        conversation_id:
          type: integer
          format: int64
        role:
          type: string
          enum:
          - user
          - assistant
          - tool
        content:
          type: string
        tool_calls:
          type: object
          additionalProperties: true
        tool_results:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    ConversationListResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConversationResponse'
    PendingActionResponse:
      type: object
      required:
      - id
      - conversation_id
      - message_id
      - tool_name
      - arguments
      - preview
      - status
      - created_at
      properties:
        id:
          type: integer
          format: int64
        conversation_id:
          type: integer
          format: int64
        message_id:
          type: integer
          format: int64
        tool_name:
          type: string
        arguments:
          type: string
        preview:
          type: string
        status:
          type: string
          enum:
          - pending
          - confirmed
          - rejected
          - expired
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        resolution:
          type: string
          enum:
          - confirmed
          - rejected
          - expired
    SettingResponse:
      type: object
      required:
      - key
      - value
      properties:
        key:
          type: string
        value:
          type: object
          additionalProperties: true
    SettingRequest:
      type: object
      required:
      - value
      properties:
        value:
          type: object
          additionalProperties: true
    ProblemDetails:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
